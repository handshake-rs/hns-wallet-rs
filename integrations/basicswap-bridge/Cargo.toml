[package]
name = "hns-wallet-basicswap-bridge"
description = "Private native HNS wallet settlement pipe for BasicSwap"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handshake-rs/hns-wallet-rs"
publish = false

[dependencies]
hex = "0.4.3"
hns-swap = "=0.4.2"
hns-wallet-chain-api = { version = "=0.2.6", path = "../../crates/hns-wallet-chain-api" }
hns-wallet-hns = { version = "=0.2.6", path = "../../crates/hns-wallet-hns" }
hns-wallet-service = { version = "=0.2.6", path = "../../crates/hns-wallet-service" }
hns-wallet-store = { version = "=0.2.6", path = "../../crates/hns-wallet-store" }
hns-wallet-types = { version = "=0.2.6", path = "../../crates/hns-wallet-types" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.20.0"

[workspace]
resolver = "3"
