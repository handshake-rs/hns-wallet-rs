[workspace]
members = [
    "crates/hns-wallet-types",
    "crates/hns-wallet-store",
    "crates/hns-wallet-chain-api",
    "crates/hns-wallet-hns",
    "crates/hns-wallet-provider",
    "crates/hns-wallet-shakedex",
    "crates/hns-wallet-market",
    "crates/hns-wallet-bitcoin-kyoto",
    "crates/hns-wallet-ethereum",
    "crates/hns-wallet-ffi",
    "crates/hns-wallet-service",
    "crates/hns-wallet-host",
    "crates/hns-wallet-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handshake-rs/hns-wallet-rs"
keywords = ["handshake", "wallet", "bitcoin", "ethereum"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
hns-wallet-types = { version = "0.1.0", path = "crates/hns-wallet-types" }
hns-wallet-store = { version = "0.1.0", path = "crates/hns-wallet-store" }
hns-wallet-chain-api = { version = "0.1.0", path = "crates/hns-wallet-chain-api" }
hns-wallet-hns = { version = "0.1.0", path = "crates/hns-wallet-hns" }
hns-wallet-provider = { version = "0.1.0", path = "crates/hns-wallet-provider" }
hns-wallet-shakedex = { version = "0.1.0", path = "crates/hns-wallet-shakedex" }
hns-wallet-market = { version = "0.1.0", path = "crates/hns-wallet-market" }
hns-wallet-bitcoin-kyoto = { version = "0.1.0", path = "crates/hns-wallet-bitcoin-kyoto" }
hns-wallet-ethereum = { version = "0.1.0", path = "crates/hns-wallet-ethereum" }
hns-wallet-ffi = { version = "0.1.0", path = "crates/hns-wallet-ffi" }
hns-wallet-service = { version = "0.1.0", path = "crates/hns-wallet-service" }
hns-wallet-host = { version = "0.1.0", path = "crates/hns-wallet-host" }

argon2 = "0.5.3"
bech32 = "0.11.0"
blake2 = "0.10.6"
bip32 = { version = "0.5.3", features = ["secp256k1"] }
bip39 = { version = "2.2.0", features = ["rand", "zeroize"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.3.3"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
# Kept on BDK 3.1's rusqlite line so the standalone workspace has one
# `sqlite3` native link target.
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
sha3 = "0.10.9"
thiserror = "2.0.12"
url = { version = "2.5.4", features = ["serde"] }
zeroize = { version = "1.8.1", features = ["derive"] }

# Reviewed canonical Handshake protocol source. Every protocol crate is pinned
# to one immutable revision; no mutable branch, tag, or sibling checkout is
# allowed. This source adoption does not imply downstream release qualification.
hns-covenants = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-marketplace-protocol = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-primitives = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-script = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-swap = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-transaction = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }
hns-urkel-proof = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "4331eee2265ebc43a28390517c24a958fa4b7733" }

# The only Bitcoin production synchronization implementation.
bdk_wallet = { version = "3.1.0", features = ["rusqlite", "keys-bip39"] }
bdk_kyoto = "0.17.0"
bip157 = "0.6.3"
bitcoin = { version = "0.32.8", features = ["serde"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
